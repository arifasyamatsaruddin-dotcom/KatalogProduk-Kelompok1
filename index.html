<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SneakerLabs</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;git
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Space Grotesk', sans-serif;
    }

    .brand-loader {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: #000000;
      text-transform: uppercase;
      opacity: 0;
      transform: scale(0.95);
      animation: fadeInScale 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeInScale {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>

<body>
  <div class="brand-loader">SneakerLabs</div>
  <script>
    setTimeout(() => {
      // Transition out effect
      document.querySelector('.brand-loader').style.transition = 'opacity 0.5s ease';
      document.querySelector('.brand-loader').style.opacity = '0';
      setTimeout(() => {
        window.location.href = "Frontend/pages/home.html";
      }, 500);
    }, 1500); // 1.5s display + 0.5s fade out = 2s total duration
  </script>
</body>

</html>
